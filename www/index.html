<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vizkazar</title>
<style>
  /* Vizkazar, dressed like tomrhodes.it: its rock navy and lichen yellow, Fira Sans, and condensed capitals
     for the buttons. The pattern fills the screen; one plate of controls sits along the bottom; the welcome sits
     in the middle until the first click. The words are filled in by the page's script, in English or Italian
     (src/Words.hx). Fira Sans: SIL Open Font License, see fonts/OFL.txt. */
  @font-face { font-family: "Fira Sans"; font-weight: 300; font-display: swap; src: url("fonts/fira-sans-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fira Sans"; font-weight: 400; font-display: swap; src: url("fonts/fira-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 400; font-display: swap; src: url("fonts/fira-sans-condensed-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 500; font-display: swap; src: url("fonts/fira-sans-condensed-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 600; font-display: swap; src: url("fonts/fira-sans-condensed-latin-600-normal.woff2") format("woff2"); }

  :root {
    --rock: #1b2848;
    --rock-deep: #141e38;
    --crevice: #151a2b;
    --lichen: #e9c93a;
    --lichen-bright: #f3d858;
    --stone: #dbd2b9;
    --sand: #a89775;
    --white-soft: #e6e9f2;
    --edge: rgba(255, 255, 255, .3);
    --sans: "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond: "Fira Sans Condensed", "Fira Sans", system-ui, sans-serif;
    --radius: 6px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--crevice); color: var(--stone); font: 300 15px/1.5 var(--sans); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  :focus-visible { outline: 2px solid var(--lichen); outline-offset: 2px; }

  /* Every control shares the site's button look: condensed capitals, a thin outline that turns lichen. */
  button, .control {
    position: relative; display: inline-flex; align-items: center; gap: 7px;
    font: 500 .8rem var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--white-soft);
    background: transparent; cursor: pointer; border: 1px solid var(--edge); border-radius: var(--radius); padding: 8px 12px;
    transition: border-color .15s ease, color .15s ease, background-color .15s ease;
  }
  button:hover, .control:hover { border-color: var(--lichen); color: #fff; }
  .control:focus-within { outline: 2px solid var(--lichen); outline-offset: 2px; }
  .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .menu-arrow { width: 14px; height: 14px; margin-left: -2px; }
  /* The file input and the menu lie invisibly over their whole button, so a tap anywhere on it opens them. */
  .control input, .control select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  #complexity-chooser { background: var(--rock-deep); }
  option { background: var(--rock-deep); color: var(--white-soft); }

  #welcome {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px;
    text-align: center; padding: 24px; background: rgba(21, 26, 43, .6);
  }
  #welcome .kicker { font: 500 .86rem var(--cond); letter-spacing: .18em; text-transform: uppercase; color: var(--lichen); margin: 0; }
  #welcome h1 { font: 400 clamp(40px, 8vw, 76px)/1.05 var(--cond); color: #fff; margin: 0; }
  #welcome p { margin: 0; max-width: 36ch; font-size: 1.05rem; }
  /* The start button is the site's solid button: lichen, rock text, lifting a touch on hover. */
  #start {
    font: 600 .95rem var(--cond); letter-spacing: .12em; padding: 13px 30px; margin-top: 6px;
    background: var(--lichen); color: var(--rock); border: 2px solid var(--lichen);
    transition: transform .15s ease, background-color .15s ease;
  }
  #start:hover { background: var(--lichen-bright); color: var(--rock); transform: translateY(-2px); }

  #controls {
    position: fixed; left: 12px; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); width: fit-content; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 10px; background: rgba(27, 40, 72, .88); border: 1px solid rgba(255, 255, 255, .14); border-radius: var(--radius);
  }
  #play-pause { background: var(--lichen); color: var(--rock); border-color: var(--lichen); min-width: 7.5em; justify-content: center; }
  #play-pause:hover { background: var(--lichen-bright); color: var(--rock); }
  #now-playing { color: #fff; font-weight: 400; padding: 0 4px 0 6px; max-width: 24ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #time { color: var(--sand); font-variant-numeric: tabular-nums; min-width: 4ch; padding-right: 4px; }
  /* A phone: icons only, all on one row; the track's name gives way first. */
  @media (max-width: 600px) {
    #controls { flex-wrap: nowrap; gap: 6px; padding: 6px; width: auto; }
    button, .control { padding: 9px; }
    #play-pause { min-width: 0; }
    .words { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .menu-arrow { display: none; }
    #now-playing { flex: 1 1 auto; min-width: 0; padding: 0 2px 0 4px; }
    #time { min-width: 0; padding-right: 2px; }
  }
</style>
</head>
<body>

<div id="stage" role="img"></div>
<audio id="player" loop></audio>

<div id="welcome">
  <p class="kicker">Lab</p>
  <h1 id="welcome-title"></h1>
  <p id="welcome-intro"></p>
  <button id="start"></button>
</div>

<!-- The panel's icons, drawn once and used by every button below. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M7 4.5 19.5 12 7 19.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-own-audio" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="icon-microphone" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5v1a7 7 0 0 0 14 0v-1M12 18.5v3"/></symbol>
  <symbol id="icon-star" viewBox="0 0 24 24"><path d="M12.0 1.0 9.6 6.3 4.2 4.2 6.3 9.6 1.0 12.0 6.3 14.4 4.2 19.8 9.6 17.7 12.0 23.0 14.4 17.7 19.8 19.8 17.7 14.4 23.0 12.0 17.7 9.6 19.8 4.2 14.4 6.3z"/></symbol>
  <symbol id="icon-full-screen" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="icon-exit-full-screen" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M16 21v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></symbol>
  <symbol id="icon-menu-arrow" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</svg>

<!-- Each control is an icon and its words; on a phone only the icon shows, and the words stay for screen readers. -->
<div id="controls" hidden>
  <button id="play-pause"><svg class="icon"><use href="#icon-pause"/></svg><span class="words"></span></button>
  <span id="now-playing"></span>
  <span id="time">0:00</span>
  <label id="own-audio-chooser" class="control"><svg class="icon"><use href="#icon-own-audio"/></svg><span class="words"></span><input id="own-audio" type="file" accept="audio/*,video/mp4,.flac,.ogg,.m4a"></label>
  <button id="microphone"><svg class="icon"><use href="#icon-microphone"/></svg><span class="words"></span></button>
  <label id="complexity-chooser" class="control"><svg class="icon"><use href="#icon-star"/></svg><span class="words"></span><svg class="icon menu-arrow"><use href="#icon-menu-arrow"/></svg>
    <select id="complexity"><option id="follow-the-music" value="auto"></option></select></label>
  <button id="full-screen"><svg class="icon"><use href="#icon-full-screen"/></svg><span class="words"></span></button>
</div>

<script src="vendor/three.min.js"></script>
<script src="visualiser.js"></script>
</body>
</html>
