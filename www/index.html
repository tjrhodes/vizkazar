<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vizkazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&family=Fira+Sans+Condensed:wght@800&display=swap">
<style>
  /* Layout: the pattern fills the screen; one quiet plate of controls sits
     along the bottom; the welcome sits in the middle until the first click.
     Colours echo src/Settings.hx (night, cream band, ochre star). */
  :root {
    --night: #0d1322;
    --plate: rgba(13, 19, 34, 0.82);
    --plate-edge: rgba(239, 230, 210, 0.2);
    --ink: #efe6d2;
    --ink-quiet: #a89775;
    --ochre: #e6a91f;
    --display: "Fira Sans Condensed", "Arial Narrow", sans-serif;
    --body: "Fira Sans", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); color: var(--ink); font: 15px/1.4 var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* Every button, the file chooser and the menu share one look. */
  button, select, .file-chooser {
    font: inherit; color: var(--ink); background: transparent; cursor: pointer;
    border: 1px solid var(--plate-edge); border-radius: 6px; padding: 7px 12px;
  }
  button:hover, select:hover, .file-chooser:hover { border-color: var(--ochre); }
  :focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
  .file-chooser input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .file-chooser:focus-within { outline: 2px solid var(--ochre); outline-offset: 2px; }

  #welcome {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px;
    text-align: center; padding: 24px; background: rgba(13, 19, 34, 0.55);
  }
  #welcome h1 { font: 800 clamp(34px, 7vw, 68px)/1 var(--display); margin: 0; letter-spacing: 0.01em; }
  #welcome p { margin: 0; max-width: 34ch; color: var(--ink-quiet); }
  #start { font: 800 22px var(--display); padding: 12px 34px; background: var(--ochre); color: var(--night); border-color: var(--ochre); }

  #controls {
    position: fixed; left: 12px; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); width: fit-content; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 10px;
    background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 10px;
  }
  #time { color: var(--ink-quiet); font-variant-numeric: tabular-nums; min-width: 4ch; }
  #now-playing { color: var(--ink-quiet); padding: 0 6px; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  label[for="complexity"] { color: var(--ink-quiet); padding-left: 6px; }
</style>
</head>
<body>

<div id="stage" role="img" aria-label="A geometric star pattern in 3D that moves with the music"></div>
<audio id="player" loop></audio>

<div id="welcome">
  <h1>Vizkazar</h1>
  <p>Star patterns from the tiles of Seville, cut, lifted and coloured by the music as it plays.</p>
  <button id="start">Play</button>
</div>

<div id="controls" hidden>
  <button id="play-pause" data-play="Play" data-pause="Pause">Pause</button>
  <span id="now-playing"></span>
  <span id="time" aria-label="Time into the track">0:00</span>
  <label class="file-chooser">Your own audio<input id="own-audio" type="file" accept="audio/*,video/mp4,.flac,.ogg,.m4a"></label>
  <button id="microphone" data-refused="Microphone not allowed">Microphone</button>
  <label for="complexity">Complexity</label>
  <select id="complexity"><option value="auto">Follow the music</option></select>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="visualiser.js"></script>
</body>
</html>
